spring.application.name=dose
spring.datasource.url=jdbc:mysql://localhost:3306/dose_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Root#831@
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect

# Hibernate gère la structure de la base
spring.jpa.hibernate.ddl-auto=update

# Afficher les requêtes SQL dans la console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
dose.security.identity-key=${DOSE_IDENTITY_KEY}
dose.security.jwt-secret=${DOSE_JWT_SECRET}
